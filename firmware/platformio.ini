; PlatformIO wrapper around the Arduino-IDE sketch in SmartClassScanner/.
; Arduino IDE users can ignore this file — see README.md.
[platformio]
src_dir = SmartClassScanner
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev                     ; ESP32-D0WD / WROOM-32D dev module (CH340 USB)
framework = arduino
board_build.partitions = huge_app.csv ; Wi-Fi + BLE + HTTP need the 3 MB app partition
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 460800
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DFW_VERSION=\"0.1.0\"
lib_deps =
  h2zero/NimBLE-Arduino@^2.3.0
