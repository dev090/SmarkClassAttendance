name: smartclass_app
description: SmartClass student app — automatic, privacy-first classroom attendance over BLE.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # BLE advertising (Android peripheral role; iOS foreground only — see docs/03-ble-protocol.md)
  flutter_ble_peripheral: ^1.2.6
  # HMAC-SHA256 for the rotating token
  crypto: ^3.0.6
  http: ^1.2.2
  shared_preferences: ^2.3.3
  permission_handler: ^11.3.1
  uuid: ^4.5.1
  # iBeacon ranging/monitoring — the iPhone path (ESP32 beacon → phone → backend)
  flutter_beacon: ^0.5.1
  # TODO(M7): flutter_foreground_task for background advertising on Android

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
